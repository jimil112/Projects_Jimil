<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Link</title>

    <!-- Google Fonts and Local Stylesheet Link -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="log_inpage.css">

    <!-- jQuery for JavaScript functionality and Google Platform Library for Google Sign-in -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <meta name="google-signin-client_id" content="487351766017-4jusms3qg6km34jlthkfcmnui3smch87.apps.googleusercontent.com">
</head>

<body>
    <!-- Header Section with navigation and logo -->
    <header>
        <div class="logo">
            <a href="#"><img src="OrganisationLogo.png" alt="Organisation Logo"></a>
        </div>
        <nav>
            <ul>
                <li><a href="../Home_page/Home_page.html" class="nav-icon-link"><img src="Home.png" alt="Home Icon" class="nav-icon"></a></li>
                <li><a href="../log-sign-in page/log_inpage.html">Login/Sign up</a></li>
                <li><a href="../About_page/About_page.html">About</a></li>
                <li><a href="../Events_Page/Events_page.html">Events</a></li>
                <li><a href="../Profile_Page/profile_page.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main content area for login and signup forms -->
    <main>
        <!-- Login Form Section -->
        <div class="login-container" id="login-container">
            <h2>Login</h2>
            <form id="login-form">
                <label for="user-type">User Type:</label>
                <select id="user-type" name="user-type">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                    <option value="manager">Manager</option>
                </select>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
            </form>
            <p id="login-message" style="color: green;"></p> <!-- Placeholder for login messages -->
            <button type="button" id="toggle-signup-btn">Sign Up</button>
        </div>

        <!-- Google Login Button -->
        <a href="/auth/google" class="google-login-button">Login with Google</a>

        <!-- Sign Up Form Section -->
        <div class="signup-container" id="signup-container" style="display: none;">
            <h2>Sign Up</h2>
            <form id="signup-form" action="/signup" method="post">
                <label for="signup-user-type">User Type:</label>
                <select id="signup-user-type" name="user_type">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                    <option value="manager">Manager</option>
                </select>

                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full_name" required>

                <label for="phone-number">Phone Number:</label>
                <input type="tel" id="phone-number" name="phone_number" required>

                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" name="signup_email" required>

                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" name="signup_password" required>

                <button type="submit">Sign Up</button>
            </form>
            <p id="signup-message" style="color: green;"></p> <!-- Placeholder for signup messages -->
            <button type="button" id="toggle-login-btn">Back to Login</button>
        </div>
    </main>

    <!-- Footer Section with navigation and contact information -->
    <footer>
        <nav>
            <ul>
                <li><a href="../Home_Page/home_page.html" class="footer-btn">Home</a></li>
                <li><a href="../About_page/About_page.html" class="footer-btn">About</a></li>
                <li><a href="../Events_Page/Events_page.html" class="footer-btn">Events</a></li>
                <li><a href="../Profile_Page/profile_page.html" class="footer-btn">Profile</a></li>
                <li><a href="../log-sign-in page/log_inpage.html" class="footer-btn">Log-In/Sign-up</a></li>
            </ul>
        </nav>
        <div class="footer-contact">
            <a href="https://www.instagram.com/foodlinkausvolunteering/" target="_blank">
                <img src="instagram.png" alt="Instagram">
            </a>
            <a href="https://x.com/foodlinkwdc2024" target="_blank">
                <img src="X.png" alt="X">
            </a>
            <a href="https://www.facebook.com/profile.php?id=61560957178941" target="_blank">
                <img src="FaceBook.png" alt="Facebook">
            </a>
            <p>Contact Us: info@volunteerhub.org</p>
        </div>
        <p>© 2024 Food Link. All rights reserved.</p>
    </footer>

    <script src="log_inpage.js"></script>
</body>
</html>
